const fx=n=>n.toFixed(1),LP=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t],AD=(a,v,k)=>[a[0]+v[0]*k,a[1]+v[1]*k];
function UN(a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1;return[dx/l,dy/l]}
function limb(a,b,r1,r2,c,o){const u=UN(a,b),n=[-u[1],u[0]];const P=[AD(a,n,r1),AD(b,n,r2),AD(b,n,-r2),AD(a,n,-r1)];
return `<g fill="${c}"${o!=null?` opacity="${o}"`:''}><path d="M${P.map(q=>fx(q[0])+','+fx(q[1])).join('L')}Z"/><circle cx="${fx(a[0])}" cy="${fx(a[1])}" r="${r1}"/><circle cx="${fx(b[0])}" cy="${fx(b[1])}" r="${r2}"/></g>`}
function ell(c,rx,ry,ang,fill,o){return `<ellipse cx="${fx(c[0])}" cy="${fx(c[1])}" rx="${rx}" ry="${ry}" transform="rotate(${fx(ang)} ${fx(c[0])} ${fx(c[1])})" fill="${fill}"${o!=null?` opacity="${o}"`:''}/>`}
function leg(hp,k,f,far){const s=far?SK2:SK,pt=far?PT2:PT;
return limb(k,f,6.6,4.8,s)+limb(hp,k,9.6,6.8,s)+limb(hp,LP(hp,k,.58),10.6,8.3,pt)+ell([f[0]+4,f[1]-1.5],7.6,4,0,far?SHOE2:SHOE)}

g+=arm(sh,P.e,P.w,0);
if(/Deltoides|Hombros/.test(m))g+=`<circle cx="${fx(sh[0])}" cy="${fx(sh[1])}" r="7" fill="${MU}" opacity="${mo}"/>`;
if(/Bíceps|Tríceps|Brazos/.test(x.t[0]+' '+x.m))g+=limb(sh,P.e,5.4,4.3,MU,mo);

function prescribe(id){const x=EX[id],g=profile.goal,l=profile.level;
let sets=l==='p'?3:(x.c||l==='a')?4:3;
let reps=g==='f'?(x.c?'4-6':'8-10'):g==='m'?(x.c?'8-10':'10-12'):'12-15';
let rest=g==='f'?(x.c?180:90):g==='m'?(x.c?120:75):60;
const ph=phase();if(ph.k==='a'&&l!=='p')sets=Math.max(2,sets-1);if(ph.k==='i'&&x.c)sets++;if(ph.k==='d')sets=Math.max(2,Math.ceil(sets/2));
if(id==='plancha'){reps='30-45 s';rest=60}if(id==='crunch'){reps='15-20';rest=60}
return{sets,reps,rest}}
function plan(){const T=TPL[profile.days],max=profile.min<=45?5:6,sw=profile.swaps||{};
return T.d.map((d,i)=>{const used=new Set(),ex=[];d[1].slice(0,max).forEach((id,j)=>{let r=sw[i+'-'+j];if(!r||!avail(r)||used.has(r))r=resolve(id,used);if(r){used.add(r);ex.push({id:r,slot:j,...prescribe(r)})}});
for(const c of cands('core')){if(ex.length>=max-1)break;if(!used.has(c)){used.add(c);ex.push({id:c,slot:10+ex.length,...prescribe(c)})}}
const secs=ex.reduce((s,e)=>s+e.sets*(40+e.rest),0)+8*60;return{name:d[0],wd:T.wd[i],ex,min:Math.round(secs/60)}})}
function fmtT(h,m){m=((m%60)+60)%60;const hh=h%24,ap=hh<12?'a. m.':'p. m.';return `${(hh%12)||12}:${String(m).padStart(2,'0')} ${ap}`}
function horario(min){const[h,m]=(profile.hour||'18:00').split(':').map(Number);const end=h*60+m+min;return fmtT(h,m)+' – '+fmtT(Math.floor(end/60),end%60)}

function lastFor(id){for(let i=log.length-1;i>=0;i--){const s=log[i].sets.filter(z=>z.ex===id&&z.done);if(s.length)return s}return null}
function bestFor(id){let b=0;log.forEach(l=>l.sets.forEach(z=>{if(z.ex===id&&z.done&&+z.kg>b)b=+z.kg}));return b}
function firstFor(id){for(const l of log){const s=l.sets.filter(z=>z.ex===id&&z.done&&+z.kg>0);if(s.length)return Math.max(...s.map(z=>+z.kg))}return 0}
function weekNum(){return Math.max(1,Math.floor((today()-new Date(profile.start+'T00:00:00'))/864e5/7)+1)}
function adherence(){const st=new Date(profile.start+'T00:00:00'),wd=TPL[profile.days].wd;let n=0;for(let d=new Date(st);d<=today();d.setDate(d.getDate()+1))if(wd.includes(d.getDay()))n++;return n?Math.min(100,Math.round(log.length/n*100)):0}
